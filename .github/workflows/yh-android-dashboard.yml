name: YH Android dashboard build

# Personal fork build: Orca Mobile with the agent dashboard screen, signed exactly like the
# official Android release (Expo prebuild's template debug keystore), so it installs over it.
on:
  push:
    branches:
      - yh/agent-dashboard
  workflow_dispatch:

concurrency:
  group: yh-android-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck app
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Dashboard tests
        run: pnpm exec vitest run src/dashboard --passWithNoTests

  android-build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # The tablet is arm64-v8a; one ABI keeps the build well inside the runner's time and disk.
      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      # Refuse to publish an APK that cannot install over the official one.
      - name: Verify signer matches the official Orca APK
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/release/*.apk)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          echo "$certs" | grep -qi 'SHA-1 digest: 5e8f16062ea3cd2c4a0d547876baa6f38cabf625'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-dashboard-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
